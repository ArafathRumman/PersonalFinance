name: Build Android APK and AAB

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 16 (API 36) platform
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Use your signing key (only if you added it as GitHub Secrets)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$KEYSTORE_PASSWORD" ] && [ -n "$KEY_ALIAS" ] && [ -n "$KEY_PASSWORD" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "RELEASE_STORE_FILE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
            echo "RELEASE_STORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
            echo "RELEASE_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
            echo "RELEASE_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"
            echo "SIGNED=true" >> "$GITHUB_ENV"
            echo "Release will be signed with YOUR key."
          else
            echo "SIGNED=false" >> "$GITHUB_ENV"
            echo "::warning::No signing key found in GitHub Secrets. The release files will be TEST-ONLY (see PUBLISHING.md to add your own key)."
          fi

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug -PversionCode=${{ github.run_number }} --stacktrace

      - name: Build release APK and AAB
        continue-on-error: true
        run: |
          gradle --no-daemon assembleRelease bundleRelease -PversionCode=${{ github.run_number }} --stacktrace \
          || gradle --no-daemon assembleRelease bundleRelease -PversionCode=${{ github.run_number }} -PminifyRelease=false --stacktrace

      - name: Collect files
        run: |
          mkdir -p dist/publish
          cp app/build/outputs/apk/debug/app-debug.apk dist/PersonalFinance-debug.apk
          if [ "$SIGNED" = "true" ]; then
            APK_NAME=PersonalFinance.apk
            AAB_NAME=PersonalFinance.aab
          else
            APK_NAME=PersonalFinance-TEST-ONLY.apk
            AAB_NAME=PersonalFinance-TEST-ONLY.aab
          fi
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            cp app/build/outputs/apk/release/app-release.apk "dist/publish/$APK_NAME"
          else
            echo "::error::The release APK was not produced"
          fi
          if [ -f app/build/outputs/bundle/release/app-release.aab ]; then
            cp app/build/outputs/bundle/release/app-release.aab "dist/publish/$AAB_NAME"
          else
            echo "::error::The release AAB was not produced"
          fi
          ls -la dist dist/publish

      - name: Save files as a downloadable artifact
        uses: actions/upload-artifact@v4
        with:
          name: PersonalFinance-builds
          path: |
            dist/PersonalFinance-debug.apk
            dist/publish/*

      - name: Publish on the Releases page
        if: hashFiles('dist/publish/*') != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Personal Finance (build ${{ github.run_number }})
          prerelease: ${{ env.SIGNED != 'true' }}
          body: |
            Download the .apk file below and open it on your Android phone to install.
            The .aab file is only for uploading to Google Play.
            Files named TEST-ONLY are signed with a temporary test key: use them for testing only (see PUBLISHING.md).
          files: dist/publish/*
